<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="R Giridhar — AI Red Teaming, Agentic Systems Security, Digital Forensics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080a"/>
      <stop offset="42%" stop-color="#07312e"/>
      <stop offset="78%" stop-color="#0a2036"/>
      <stop offset="100%" stop-color="#05080a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ff3e3"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="18%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="62%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#2dd4bf" stroke-width="0.5" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect width="520" height="240" fill="url(#glow)"/>

  <rect x="48" y="52" width="3" height="136" fill="#2dd4bf" rx="1.5"/>

  <text x="72" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#2dd4bf" opacity="0.9">giridhar@amrita:~$ whoami</text>
  <rect x="312" y="68" width="9" height="18" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="150" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="7" fill="url(#txt)">R GIRIDHAR</text>

  <text x="74" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" letter-spacing="2.6" fill="#8fb5b0">AI RED TEAMING &#183; AGENTIC SYSTEMS SECURITY &#183; DIGITAL FORENSICS</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#4f7d78" letter-spacing="1.5">
    <text x="1128" y="76" text-anchor="end">B.TECH CSE (CYBER SECURITY)</text>
    <text x="1128" y="98" text-anchor="end">AMRITA VISHWA VIDYAPEETHAM &#183; &#39;27</text>
    <text x="1128" y="120" text-anchor="end">COIMBATORE, INDIA</text>
  </g>

  <rect x="0" y="234" width="1200" height="2" fill="url(#rule)"/>
</svg>
